name: Zoho People Automated Check-in & Timesheet

on:
  schedule:
    # Check-in Mon-Fri at 08:55 UTC (adjust for local timezone)
    - cron: '55 8 * * 1-5'
    # Check-out Mon-Fri at 17:00 UTC (adjust for local timezone)
    - cron: '0 17 * * 1-5'
    # Monthly Timesheet on the 28th of every month at 18:00 UTC
    - cron: '0 18 28 * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'checkin'
        type: choice
        options:
          - checkin
          - checkout
          - timesheet
          - checkin-dry
          - timesheet-dry

jobs:
  run-zoho-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Check-In / Check-Out / Timesheet
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: ${{ secrets.ZOHO_ACCOUNTS_URL || 'https://accounts.zoho.com' }}
          ZOHO_PEOPLE_URL: ${{ secrets.ZOHO_PEOPLE_URL || 'https://people.zoho.com' }}
          ZOHO_EMP_ID: ${{ secrets.ZOHO_EMP_ID }}
          ZOHO_EMP_EMAIL: ${{ secrets.ZOHO_EMP_EMAIL }}
          DEFAULT_CHECKIN_TIME: ${{ secrets.DEFAULT_CHECKIN_TIME || '09:00' }}
          DEFAULT_CHECKOUT_TIME: ${{ secrets.DEFAULT_CHECKOUT_TIME || '17:00' }}
          JITTER_MINUTES: ${{ secrets.JITTER_MINUTES || '5' }}
          TIMESHEET_WORK_HOURS: ${{ secrets.TIMESHEET_WORK_HOURS || '8.0' }}
          TIMESHEET_JOB_NAME: ${{ secrets.TIMESHEET_JOB_NAME || 'General Work' }}
        run: |
          # If triggered manually via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
            if [ "$ACTION" = "checkin" ]; then
              npm run checkin
            elif [ "$ACTION" = "checkout" ]; then
              npm run checkout
            elif [ "$ACTION" = "timesheet" ]; then
              npm run timesheet
            elif [ "$ACTION" = "checkin-dry" ]; then
              npm run checkin:dry
            elif [ "$ACTION" = "timesheet-dry" ]; then
              npm run timesheet:dry
            fi
          else
            # Cron trigger logic based on current UTC hour
            HOUR=$(date -u +%H)
            DOM=$(date -u +%d)
            if [ "$DOM" = "28" ] && [ "$HOUR" = "18" ]; then
              echo "Executing monthly timesheet submission..."
              npm run timesheet
            elif [ "$HOUR" -lt 12 ]; then
              echo "Executing morning check-in..."
              npm run checkin
            else
              echo "Executing evening check-out..."
              npm run checkout
            fi
          fi
